<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin • Focus Estética Automotiva</title><style>:root{--y:#ffad00;--o:#ff7a00}*{box-sizing:border-box}body{margin:0;background:#070707;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:16px}.card{background:#111;border:1px solid #292929;border-radius:16px;padding:16px;margin-bottom:14px}.brand{color:var(--y);font-weight:800;font-size:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}label{font-size:12px;color:#aaa}input{background:#181818;color:#fff;border:1px solid #3a3a3a;border-radius:9px;padding:11px}button{border:0;border-radius:9px;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:linear-gradient(90deg,var(--o),var(--y));color:#111}.dark{background:#222;color:#fff;border:1px solid #444}.booking{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#181818;border:1px solid #2d2d2d;border-radius:10px;padding:12px;margin-top:8px}.muted{color:#aaa;font-size:12px}.error{background:#3a1515;color:#ffb2b2;padding:10px;border-radius:8px;margin-top:10px}.ok{background:#10351f;color:#a9f5c5;padding:10px;border-radius:8px;margin-top:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}.booking{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="card"><div class="brand">FOCUS • ÁREA ADMINISTRATIVA</div><div class="muted">Acesso protegido pelo Supabase. Esta área não aparece para os clientes.</div></div><section id="login" class="card"><h2>Entrar</h2><div class="grid"><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password"></div></div><button type="button" class="primary" id="loginBtn" style="margin-top:12px">Entrar</button><div id="loginMsg"></div></section><section id="app" class="card" style="display:none"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div><h2 style="margin:0">📋 Agendamentos</h2><div id="who" class="muted"></div></div><div><input id="date" type="date"><button class="dark" id="refresh">Atualizar</button><button class="dark" id="logout">Sair</button></div></div><div id="msg"></div><div id="list" style="margin-top:12px"></div></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL="https://yxlvdjimtracwszkphxi.supabase.co",KEY="sb_publishable_Qqrn9fUXp-Es_a0fIN9aOQ_KuamfYy3",sb=supabase.createClient(URL,KEY);const login=document.getElementById('login'),app=document.getElementById('app'),msg=document.getElementById('msg'),loginMsg=document.getElementById('loginMsg');function note(el,t,c){el.className=c;el.textContent=t}async function check(){try{const {data:{session},error:sessionError}=await sb.auth.getSession();if(sessionError)throw sessionError;if(!session){login.style.display='block';app.style.display='none';return}const {data:isAdmin,error}=await sb.rpc('is_admin');if(error)throw error;if(isAdmin!==true){await sb.auth.signOut();login.style.display='block';app.style.display='none';note(loginMsg,'Este usuário não possui acesso administrativo.','error');return}login.style.display='none';app.style.display='block';document.getElementById('who').textContent=session.user.email;document.getElementById('date').value=new Date().toISOString().slice(0,10);await load()}catch(err){login.style.display='block';app.style.display='none';note(loginMsg,'Erro no painel: '+(err?.message||err),'error')}}document.getElementById('loginBtn').onclick=async()=>{loginMsg.textContent='';const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password){note(loginMsg,'Informe e-mail e senha.','error');return}const btn=document.getElementById('loginBtn');btn.disabled=true;btn.textContent='Entrando...';try{const {data,error}=await sb.auth.signInWithPassword({email,password});if(error){note(loginMsg,error.message||'E-mail ou senha inválidos.','error');return}if(!data?.session){note(loginMsg,'Login realizado, mas a sessão não foi criada. Verifique se o e-mail do usuário está confirmado no Supabase.','error');return}await check()}catch(err){note(loginMsg,'Erro ao conectar ao Supabase: '+(err?.message||err),'error')}finally{btn.disabled=false;btn.textContent='Entrar'}};async function load(){msg.textContent='';const date=document.getElementById('date').value;let q=sb.from('bookings').select('*').order('booking_date',{ascending:true}).order('booking_time',{ascending:true});if(date)q=q.eq('booking_date',date);const {data,error}=await q;if(error){note(msg,'Erro ao carregar agendamentos: '+error.message,'error');return}const list=document.getElementById('list');list.innerHTML='';if(!data?.length){list.innerHTML='<div class="muted">Nenhum agendamento para esta data.</div>';return}data.forEach(v=>{const e=document.createElement('div');e.className='booking';e.innerHTML=`<div><b>⏰ ${String(v.booking_time).slice(0,5)} — ${v.customer_name}</b><br><span class="muted">🚗 ${v.vehicle||''} • 🧽 ${v.service||''} • 💰 R$ ${Number(v.service_price||0).toLocaleString('pt-BR',{minimumFractionDigits:2})}<br>📞 ${v.customer_phone||''}<br>📍 ${v.pickup_address||'Não informado'}</span></div>`;const b=document.createElement('button');b.className='dark';b.textContent='Liberar horário';b.onclick=async()=>{if(!confirm('Liberar este agendamento?'))return;const {error}=await sb.from('bookings').delete().eq('id',v.id);if(error)note(msg,'Não foi possível excluir: '+error.message,'error');else{note(msg,'Agendamento removido.','ok');load()}};e.appendChild(b);list.appendChild(e)})}document.getElementById('refresh').onclick=load;document.getElementById('date').onchange=load;document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();check()};check();</script></body></html>
