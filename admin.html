<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focus • Área Administrativa</title><style>:root{--y:#ffad00;--o:#ff7a00}*{box-sizing:border-box}body{margin:0;background:#070707;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:16px}.card{background:#111;border:1px solid #292929;border-radius:16px;padding:18px;margin-bottom:14px}.brand{color:var(--y);font-weight:800;font-size:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:6px}label{font-size:13px;color:#aaa}input{width:100%;background:#181818;color:#fff;border:1px solid #3a3a3a;border-radius:9px;padding:13px;font-size:16px}.primary{margin-top:12px;background:linear-gradient(90deg,var(--o),var(--y));color:#111;border:0;border-radius:9px;padding:13px 18px;font-weight:800;font-size:16px}.dark{background:#222;color:#fff;border:1px solid #444;border-radius:9px;padding:11px 14px;font-weight:700}.muted{color:#aaa;font-size:13px}.error{background:#3a1515;color:#ffb2b2;padding:12px;border-radius:8px;margin-top:12px}.ok{background:#10351f;color:#a9f5c5;padding:12px;border-radius:8px;margin-top:12px}.booking{background:#181818;border:1px solid #2d2d2d;border-radius:10px;padding:14px;margin-top:10px}.booking button{margin-top:10px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="card"><div class="brand">FOCUS • ÁREA ADMINISTRATIVA</div><div class="muted">Acesso protegido pelo Supabase.</div></div><section id="login" class="card"><h2>Entrar</h2><div class="grid"><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password"></div></div><button id="loginBtn" class="primary" type="button">Entrar</button><div id="loginMsg"></div></section><section id="app" class="card" style="display:none"><div class="top"><div><h2 style="margin:0">📋 Agendamentos</h2><div id="who" class="muted"></div></div><div><input id="date" type="date"><button id="refresh" class="dark" type="button">Atualizar</button><button id="logout" class="dark" type="button">Sair</button></div></div><div id="msg"></div><div id="list"></div></section></div>
<script>
const BASE='https://yxlvdjimtracwszkphxi.supabase.co';
const KEY='sb_publishable_Qqrn9fUXp-Es_a0fIN9aOQ_KuamfYy3';
const $=id=>document.getElementById(id);
function show(el,text,kind){el.className=kind||'';el.textContent=text}
async function api(path,opts={}){const h=Object.assign({'apikey':KEY,'Content-Type':'application/json'},opts.headers||{});const r=await fetch(BASE+path,{...opts,headers:h});let body=null;try{body=await r.json()}catch(e){}if(!r.ok){throw new Error(body?.msg||body?.message||body?.error_description||body?.error||('HTTP '+r.status))}return body}
async function login(){const email=$('email').value.trim(),password=$('password').value;$('loginBtn').disabled=true;$('loginBtn').textContent='Entrando...';show($('loginMsg'),'Conectando ao Supabase...','muted');try{const d=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});if(!d.access_token)throw new Error('O Supabase não retornou uma sessão.');localStorage.setItem('focus_admin_token',d.access_token);localStorage.setItem('focus_admin_user',JSON.stringify(d.user||{}));await openApp(d.access_token,d.user||{});}catch(e){show($('loginMsg'),'Erro no login: '+e.message,'error');}finally{$('loginBtn').disabled=false;$('loginBtn').textContent='Entrar';}}
async function openApp(token,user){try{const d=await api('/rest/v1/rpc/is_admin',{method:'POST',headers:{'Authorization':'Bearer '+token},body:'{}'});if(d!==true){throw new Error('Este usuário não está cadastrado como administrador no Supabase.');}$('login').style.display='none';$('app').style.display='block';$('who').textContent=user.email||'';$('date').value=new Date().toISOString().slice(0,10);await load(token);}catch(e){localStorage.removeItem('focus_admin_token');localStorage.removeItem('focus_admin_user');show($('loginMsg'),e.message,'error');}}
async function load(token){show($('msg'),'Carregando...','muted');const date=$('date').value;try{const d=await api('/rest/v1/bookings?select=*&booking_date=eq.'+encodeURIComponent(date)+'&order=booking_time.asc',{headers:{'Authorization':'Bearer '+token}});const list=$('list');list.innerHTML='';if(!d.length){list.innerHTML='<div class="muted" style="margin-top:12px">Nenhum agendamento para esta data.</div>';show($('msg'),'','');return}d.forEach(v=>{const e=document.createElement('div');e.className='booking';e.innerHTML='<b>⏰ '+String(v.booking_time).slice(0,5)+' — '+(v.customer_name||'')+'</b><div class="muted" style="margin-top:6px">🚗 '+(v.vehicle||'')+' • 🧽 '+(v.service||'')+'<br>💰 R$ '+Number(v.service_price||0).toLocaleString('pt-BR',{minimumFractionDigits:2})+'<br>📞 '+(v.customer_phone||'')+'<br>📍 '+(v.pickup_address||'Não informado')+'</div>';const b=document.createElement('button');b.className='dark';b.type='button';b.textContent='Liberar horário';b.onclick=async()=>{if(!confirm('Liberar este agendamento?'))return;try{await api('/rest/v1/bookings?id=eq.'+encodeURIComponent(v.id),{method:'DELETE',headers:{'Authorization':'Bearer '+token,'Prefer':'return=minimal'}});show($('msg'),'Agendamento removido.','ok');load(token)}catch(e){show($('msg'),'Erro ao liberar: '+e.message,'error')}};e.appendChild(b);list.appendChild(e)});show($('msg'),'','');}catch(e){show($('msg'),'Erro ao carregar: '+e.message,'error');}}
$('loginBtn').onclick=login;$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('refresh').onclick=()=>load(localStorage.getItem('focus_admin_token'));$('date').onchange=()=>load(localStorage.getItem('focus_admin_token'));$('logout').onclick=()=>{localStorage.removeItem('focus_admin_token');localStorage.removeItem('focus_admin_user');location.reload()};
(async()=>{const token=localStorage.getItem('focus_admin_token');if(token){try{await openApp(token,JSON.parse(localStorage.getItem('focus_admin_user')||'{}'))}catch(e){}}})();
</script></body></html>
